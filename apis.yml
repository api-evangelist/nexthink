aid: nexthink
name: Nexthink
description: >-
  Nexthink is a digital employee experience (DEX) management company. Its Infinity
  platform combines real-time endpoint analytics, employee sentiment, and automated
  remediation so IT teams can proactively detect and fix issues across every device.
  Nexthink exposes a set of OAuth 2.0-secured public APIs — NQL (query), Remote
  Actions, Workflows, Enrichment, Campaigns, Data Management, and Spark — that let
  external tools pull DEX data and drive endpoint automation. Backed by Index
  Ventures; added to the API Evangelist network and enriched from Nexthink's
  published developer documentation.
